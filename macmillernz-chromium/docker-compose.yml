version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: macmillernz-chromium_redirect_1
      APP_PORT: 80

  # Newer linuxserver.io images (Selkies) only work over HTTPS, and Umbrel's
  # app proxy is HTTP only. This sends the Umbrel dashboard tile to the
  # image's own HTTPS port on the same host.
  redirect:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: on-failure
    command:
      - sh
      - -c
      - |
        printf 'server { listen 80; location / { return 302 https://$$host:3481/; } }\n' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'

  chromium:
    image: lscr.io/linuxserver/chromium:b1ee1dc8-ls55@sha256:cf6200ccdcb224feaf5d3bde4ce45b3783c926a7496c98059cae1e0db78e5b2f
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # Port 3481 bypasses Umbrel's login, so require the credentials
      # umbrelOS shows when you open the app.
      - CUSTOM_USER=umbrel
      - PASSWORD=${APP_PASSWORD}
    ports:
      - "3481:3001"
    volumes:
      - ${APP_DATA_DIR}/data:/config
    shm_size: "1gb"
