description: >-
  Chromium is the open-source web browser project behind Google Chrome, Microsoft Edge and many others, running on your Umbrel and accessible from any device.


  This runs the linuxserver.io Chromium image, which needs an HTTPS connection. Requires umbrelOS 2.0 or later,
  which opens it at https://<your-umbrel>:3480 using Umbrel's certificate. Your browser may show a
  privacy warning the first time.
