manifestVersion: 1
id: macmillernz-chromium
name: Chromium
tagline: The open-source browser project
icon: https://getumbrel.github.io/umbrel-apps-gallery/chromium/icon.svg
category: networking
version: "b1ee1dc8-ls55"
