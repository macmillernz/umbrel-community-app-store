version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: macmillernz-firefox_redirect_1
      APP_PORT: 80

  # Newer linuxserver.io images (Selkies) only work over HTTPS, and Umbrel's
  # app proxy is HTTP only. This sends the Umbrel dashboard tile to the
  # image's own HTTPS port on the same host.
  redirect:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: on-failure
    command:
      - sh
      - -c
      - |
        printf 'server { listen 80; location / { return 302 https://$$host:3491/; } }\n' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'

  firefox:
    image: lscr.io/linuxserver/firefox:1156.0build1-1xtradeb1.2404.1-ls123@sha256:549e3f7e631169c4763709f1b29c035f561849cd1603f9e47f598b831fc4b9d6
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # Port 3491 bypasses Umbrel's login, so require the credentials
      # umbrelOS shows when you open the app.
      - CUSTOM_USER=umbrel
      - PASSWORD=${APP_PASSWORD}
    ports:
      - "3491:3001"
    volumes:
      - ${APP_DATA_DIR}/data:/config
    shm_size: "1gb"
