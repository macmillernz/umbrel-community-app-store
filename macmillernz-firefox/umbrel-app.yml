manifestVersion: 1
id: macmillernz-firefox
name: Firefox
tagline: Free and open-source web browser
icon: https://getumbrel.github.io/umbrel-apps-gallery/firefox/icon.svg
category: networking
version: "1156.0build1-ls123"
port: 3490
description: >-
  Firefox is Mozilla's free, open-source, privacy-focused web browser, running on your Umbrel and accessible from any device.


  This runs the linuxserver.io Firefox image, which needs an HTTPS connection. Requires umbrelOS 2.0 or later,
  which opens it at https://<your-umbrel>:3490 using Umbrel's certificate. Your browser may show a
  privacy warning the first time.
